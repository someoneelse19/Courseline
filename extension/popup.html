<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Courseline Capture</title>
<style>
  :root { --bg: #fff; --fg: #171717; --muted: #737373; --line: #e5e5e5; --chip: #f5f5f5; --warn: #b45309; --warn-bg: #fef3c7; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171717; --fg: #fafafa; --muted: #a3a3a3; --line: #404040; --chip: #262626; --warn: #fbbf24; --warn-bg: #3a2a05; --bad: #f87171; } }
  body { margin: 0; width: 360px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  main { padding: 14px 16px 16px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .muted { color: var(--muted); }
  .course { padding: 8px 0; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .name { font-weight: 600; }
  .stale { color: var(--warn); }
  .chips { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--chip); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .addr { margin-top: 10px; }
  .addr label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .addr-row { display: flex; gap: 6px; }
  .addr-row input { flex: 1; min-width: 0; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .addr-row button { margin: 0; }
  #addrMsg.err { color: var(--bad); }
  .host-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 4px; }
  .link { background: none; border: 0; padding: 0; margin: 0; color: var(--muted); text-decoration: underline; font-size: 12px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 2px 0; }
  th { color: var(--muted); font-weight: 500; }
  .bad { color: var(--bad); font-weight: 600; }
  button { margin-top: 14px; margin-right: 6px; font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); color: var(--fg); cursor: pointer; }
  button.armed { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Courseline Capture</h1>
  <div id="summary" class="muted">Loading…</div>
  <div class="addr">
    <label for="addr">Canvas address</label>
    <div class="addr-row">
      <input id="addr" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://yourschool.instructure.com" />
      <button id="saveAddr" type="button">Save</button>
    </div>
    <div id="addrMsg" class="muted" role="status"></div>
  </div>
  <div id="host" class="muted"></div>
  <div id="coverage"></div>
  <div id="warn"></div>
  <h2>Courses</h2>
  <div id="courses"></div>
  <div id="account"></div>
  <h2>Health</h2>
  <div id="health"></div>
  <h2>Also saved (not shown in Courseline yet)</h2>
  <div id="unmapped"></div>
  <button id="sync" type="button">Sync in Courseline</button>
  <button id="export" type="button">Export everything (JSON)</button>
  <button id="copy" type="button">Copy response shapes</button>
  <button id="clear" type="button">Clear captured data</button>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
